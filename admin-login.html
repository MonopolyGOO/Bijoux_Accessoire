<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Bijoux Accessoire</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><main class="admin-login"><div class="login-card"><span class="logo-mark">BA</span><h1>لوحة الإدارة</h1><p>Bijoux Accessoire</p><input id="password" type="password" placeholder="كلمة المرور التجريبية"><button id="login" class="primary full">دخول</button><small>أدخل كلمة مرور الإدارة للمتابعة.</small><div id="err" class="error"></div></div></main><script>const KEY='ba_admin_password'; if(!localStorage.getItem(KEY)) localStorage.setItem(KEY,'2003'); document.querySelector('#login').onclick=()=>{const pwd=document.querySelector('#password').value;if(pwd===localStorage.getItem(KEY)){sessionStorage.setItem('ba_admin','1');location.href='admin.html'}else document.querySelector('#err').textContent='كلمة المرور غير صحيحة'};</script></body></html>
