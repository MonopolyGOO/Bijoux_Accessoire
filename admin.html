<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Bijoux Accessoire</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-top"><div class="wrap"><div><b>Bijoux Accessoire</b><span>لوحة الإدارة</span></div><div><a href="index.html">عرض المتجر</a><button id="logout">خروج</button></div></div></div><main class="wrap admin-main"><div class="stats"><div><span>المنتجات</span><b id="sProducts">0</b></div><div><span>الطلبات</span><b id="sOrders">0</b></div><div><span>طلبات جديدة</span><b id="sNew">0</b></div><div><span>مخزون منخفض</span><b id="sLow">0</b></div></div><section class="panel"><div class="panel-title"><h2 id="formTitle">إضافة منتج</h2></div><div class="form-grid"><input id="pName" placeholder="اسم المنتج"><select id="pCat"><option>سلاسل</option><option>أساور</option><option>خواتم</option><option>أقراط</option><option>أطقم</option></select><input id="pPrice" type="number" step="0.01" placeholder="السعر بالدرهم"><input id="pStock" type="number" placeholder="المخزون"><input id="pImage" placeholder="رابط صورة المنتج"><input id="pFile" type="file" accept="image/*"><textarea id="pDesc" placeholder="وصف قصير"></textarea><label class="check"><input id="pActive" type="checkbox" checked> عرض المنتج للعميل</label></div><div class="form-actions"><button id="saveProduct" class="primary">إضافة المنتج</button><button id="cancel" class="light-btn" hidden>إلغاء التعديل</button><span id="formMsg"></span></div></section><section class="panel"><div class="panel-title"><h2>المنتجات</h2><input id="productSearch" class="search" placeholder="بحث..."></div><div class="table-wrap"><table><thead><tr><th>الصورة</th><th>المنتج</th><th>القسم</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="productsBody"></tbody></table></div></section><section class="panel"><div class="panel-title"><h2>الطلبات</h2><input id="orderSearch" class="search" placeholder="بحث بالاسم أو الهاتف..."></div><div class="table-wrap"><table><thead><tr><th>العميل</th><th>الهاتف</th><th>المدينة</th><th>المجموع</th><th>المنتجات</th><th>الحالة</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></main><script src="admin.js"></script></body></html>
