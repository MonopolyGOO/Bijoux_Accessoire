<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة Admin | Bijoux Accessoire</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="admin-header"><div class="container nav"><div class="brand"><img src="assets/logo.png"><span>Bijoux <b>Admin</b></span></div><button id="logout" class="btn">خروج</button></div></header><main class="container"><div class="admin-title"><div><p class="eyebrow">إدارة المتجر</p><h1>لوحة التحكم</h1></div><a class="btn outline" href="index.html">موقع العميل</a></div><section class="stats"><div class="stat"><span>المنتجات</span><strong id="statProducts">0</strong></div><div class="stat"><span>الطلبات</span><strong id="statOrders">0</strong></div><div class="stat"><span>طلبات جديدة</span><strong id="statNew">0</strong></div><div class="stat"><span>مخزون منخفض</span><strong id="statLow">0</strong></div></section><section class="panel"><div class="section-head"><h2 id="formTitle">إضافة منتج</h2><button class="btn outline" id="cancelEdit" hidden>إلغاء التعديل</button></div><form id="productForm" class="form two"><input id="pName" required placeholder="اسم المنتج"><input id="pPrice" required type="number" step="0.01" placeholder="السعر بالدرهم"><textarea id="pDesc" placeholder="الوصف"></textarea><input id="pStock" required type="number" min="0" placeholder="المخزون"><input id="pImage" type="url" placeholder="رابط الصورة (اختياري)"><input id="pFile" type="file" accept="image/*"><label class="check"><input id="pActive" type="checkbox" checked> المنتج ظاهر للعملاء</label><button class="btn gold" id="saveProduct">إضافة المنتج</button></form><div id="productMsg" class="notice" hidden></div></section><section class="panel"><div class="section-head"><h2>المنتجات</h2><input id="productSearch" class="search" placeholder="بحث عن منتج"></div><div class="table-wrap"><table class="table"><thead><tr><th>الصورة</th><th>المنتج</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="productsBody"></tbody></table></div></section><section class="panel"><div class="section-head"><h2>الطلبات</h2><input id="orderSearch" class="search" placeholder="بحث بالاسم أو الهاتف"></div><div class="table-wrap"><table class="table"><thead><tr><th>العميل</th><th>الهاتف</th><th>المدينة</th><th>المجموع</th><th>المنتجات</th><th>الحالة</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></main><div id="toast" class="toast"></div><script src="config.js"></script><script src="admin.js"></script></body></html>
